<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18212e" />
  <meta name="color-scheme" content="light dark" />
  <title>Fusion247 Cockpit</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fusion247" />
  <link rel="icon" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/vendor/vue.global.prod.js"></script>
  <!-- The apps registry publishes window.FUSION_APPS and MUST load before app.js reads it. -->
  <script src="/apps.js"></script>
  <script src="/app.js"></script>
  <script>
    // Register the service worker only in a secure context (https / localhost). Over plain http on the
    // tailnet IP the browser blocks it — which is exactly why the installable app wants the https ts.net URL.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('sw', e.message)));
    }
  </script>
</body>
</html>
