<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background so the maskable safe-zone crop never bites into the mark -->
  <rect width="512" height="512" fill="#0e1620"/>
  <rect width="512" height="512" fill="url(#g)" opacity="0.5"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0e7c86"/>
      <stop offset="100%" stop-color="#0e1620"/>
    </radialGradient>
  </defs>
  <!-- Concentric "signal reaching you" arcs + a dot: the cockpit brings the right thing to you -->
  <g fill="none" stroke="#37c3c9" stroke-linecap="round">
    <path d="M256 300 a 78 78 0 0 1 0 -156" stroke-width="18" opacity="0.9"/>
    <path d="M256 340 a 118 118 0 0 1 0 -236" stroke-width="16" opacity="0.6"/>
    <path d="M256 380 a 158 158 0 0 1 0 -316" stroke-width="14" opacity="0.35"/>
  </g>
  <circle cx="256" cy="222" r="30" fill="#37c3c9"/>
  <text x="256" y="430" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="62" font-weight="800" fill="#e7edf5" text-anchor="middle" letter-spacing="-1">F247</text>
</svg>
