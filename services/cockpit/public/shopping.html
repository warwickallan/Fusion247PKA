<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ══ A SEPARATE SURFACE, NOT A MODE ═══════════════════════════════════════════════════════════
       Addendum B §2, with its four recorded reasons. The load-bearing one: "any control that
       switches INTO her view is a control that can switch OUT of it. One stray tap and she is
       inside an operator console." So this is its own document, its own stylesheet and its own
       script. There is NO link, button, breadcrumb or route from here into the operator surface,
       and none from there to here. That is enforced by construction rather than by care: this page
       never loads app.js, apps.js or styles.css, so the operator UI is not present to be reached.

       ⛔ THREE THINGS THIS PAGE DELIBERATELY DOES NOT LOAD, each with its reason:

       1. /styles.css — NOT because the tokens are wrong (this surface ADOPTS GL-003's colour
          tokens; see shopping.css) but because styles.css is in the service worker's SHELL list.
          Sharing it would serve her Warwick's CACHED copy, so an operator-side change could alter
          her surface days later with no deploy. Her stylesheet is outside SHELL and therefore
          always network-fresh.

       2. /manifest.webmanifest — its `name` is "Fusion247 Cockpit". If she ever added this page to
          her home screen, the icon under her finger would read the one word Addendum B §2 says must
          never appear on her screen. A manifest for this surface is real work (its own name, its
          own icon, its own scope) and is NOT built tonight; linking his would have been an AC3
          defect delivered through the launcher rather than through the page.

       3. /sw.js — not registered here. Her page is inside the root scope of the operator's worker
          and is fetch-through (that worker caches nothing it was not given at install), so this
          page is always fresh. Registering it FROM here would additionally install the operator's
          shell onto her device. Offline behaviour (Addendum B §9.6) is therefore NOT BUILT — see
          the return note. Deferred honestly rather than half-built.

       ⛔ NO WEBFONT. GL-003 §3: the stack is system-native by design. Addendum B §3 repeats it for
       this surface, and Addendum A adds the reason that matters here — the tablet may be on a slow
       or dropping household connection, and a font that fails to load must never delay her words.

       ⚠️ ONE THING THIS PAGE *DOES* SHARE WITH THE OPERATOR SHELL — STATED RATHER THAN LEFT IMPLIED
       (Vera, WP-B15-45 LOW-1). /vendor/vue.global.prod.js IS in the service worker's SHELL list, so
       the argument made above against sharing styles.css applies to it too: on a device that has
       installed the operator app, this page is served Vue from that worker's cache.

       It is accepted rather than overlooked, and the reasoning is not the same as for the
       stylesheet. The vendored Vue is a PINNED third-party build that changes only when someone
       deliberately upgrades it; styles.css is edited by ordinary operator-side work and would carry
       those edits onto her screen days later with no deploy. A stale pinned runtime is a much
       narrower risk than a stale stylesheet, and the alternative — a second copy of Vue under its
       own path — costs 160KB and a second thing to keep in step.

       ⛔ IT IS NOT ZERO RISK, and the honest form of the claim is therefore: this page is decoupled
       from operator STYLING and operator MARKUP, not from every shared byte. If the vendored Vue is
       ever upgraded, this surface must be re-rendered and re-measured like any other consumer.
  ═══════════════════════════════════════════════════════════════════════════════════════════════ -->

  <!-- PINNED SCHEME. Approved by Larry as Assumption 3, and the reason is hers, not ours: a screen
       that changes appearance for no reason she caused is a hazard for a technology-phobic user who
       already fears breaking it. It also halves the contrast surface — every pairing below is a
       LIGHT-mode figure from GL-003 §2b, and none of them has to survive a scheme it will never be
       rendered in. `color-scheme: light` also stops the browser force-darkening form controls. -->
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#eef1f5" />

  <!-- The page title carries the pending-question count (Addendum B §7.1.4) so a backgrounded tab
       still shows it. Set at runtime by shopping.js; this is the resting value.
       ⛔ The word "Cockpit" does not appear here. That is not an oversight to be tidied up later. -->
  <title>This week's shopping</title>

  <link rel="stylesheet" href="/shopping.css" />
</head>
<body>
  <!-- The mount point is #shop, not #app: the operator page mounts #app, and two surfaces sharing a
       mount id is how a stray script ends up rendering the wrong UI into the right hole. -->
  <div id="shop"></div>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/shopping.js"></script>
</body>
</html>
