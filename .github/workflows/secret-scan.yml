name: secret-scan

# Security finding F-02 (wp0-security-gate.md §6 hard-stop): secret scanning is
# an ENFORCED control. CI is the enforcement point; the local pre-commit hook is
# a convenience mirror of this same script.
#
# NOTE: deliberately NO path filter. A path-filtered workflow that stops running
# disappears from `gh run list` and leaves a wall of green over a control nobody
# is executing. This one runs on every push and every pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The enforced control itself runs FIRST and unconditionally, so nothing
      # added below can ever displace it.
      - name: Scan tracked files for secret values
        run: bash scripts/secret-scan.sh

      # ---------------------------------------------------------------------
      # The control's own proofs.
      #
      # A secret scanner's dangerous failure mode is a FALSE GREEN — reporting
      # clean over ground it never read. The step above passing tells you this
      # repo is clean only if the scanner is still capable of saying otherwise.
      # These proofs are what establish that, so they run in CI rather than
      # sitting in the repo never executed.
      # ---------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the scanner refuses unscannable ground
        run: |
          set -uo pipefail

          # An explicit file path, never a glob: on Node 22 a glob matching no
          # files exits 0 having run zero tests, which is the very failure this
          # step exists to prevent.
          node --test scripts/secret-scan.test.mjs > tap.out 2>&1
          runner_status=$?
          cat tap.out

          num() { sed -n "s/^# $1 \([0-9][0-9]*\)\$/\1/p" tap.out | tail -1; }
          tests=$(num tests); pass=$(num pass); fail=$(num fail); skipped=$(num skipped)

          echo "----------------------------------------------------------------"
          echo "executed: tests=${tests:-?} pass=${pass:-?} fail=${fail:-?} skipped=${skipped:-?}"

          # Which subtests skipped, and why. A skip is an UNPROVEN branch, not a
          # passing one, so print them rather than letting this job's green imply
          # full coverage. In particular the chmod-000 subtest cannot execute on
          # Windows and is expected to execute here — if it still appears below,
          # that branch is unproven on every platform and should be said so.
          if grep -q '# SKIP' tap.out; then
            echo "SKIPPED subtests (branches NOT proven by this run):"
            grep '# SKIP' tap.out | sed 's/^/  /'
          elif [ -n "${tests:-}" ] && [ "$tests" -gt 0 ]; then
            echo "SKIPPED subtests: none — every branch executed."
          else
            # Never say "every branch executed" when nothing ran. That is the
            # same false assurance this whole control exists to eliminate.
            echo "SKIPPED subtests: n/a — nothing executed."
          fi
          echo "----------------------------------------------------------------"

          # THE ASSERTION THIS STEP EXISTS FOR: a non-zero EXECUTED count, read
          # from the runner's own output. An exit code of 0 over zero tests is
          # not evidence that anything ran.
          if [ -z "$tests" ] || [ -z "$pass" ] || [ -z "$fail" ]; then
            echo "::error::the test runner produced no counts — cannot confirm anything executed"
            exit 1
          fi
          if [ "$tests" -eq 0 ] || [ "$pass" -eq 0 ]; then
            echo "::error::zero tests executed — a green here would prove nothing"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail proof(s) failed"
            exit 1
          fi
          if [ "$runner_status" -ne 0 ]; then
            echo "::error::test runner exited $runner_status"
            exit 1
          fi

          echo "$pass proof(s) executed and passed."
