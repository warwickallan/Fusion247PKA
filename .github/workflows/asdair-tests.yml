name: asdair-tests

# CI for IDEA-012 AsdAIr WP1 (the read-only household-shopping skill).
#
# Two jobs:
#   * unit        - the skill's node --test suite with NO database. The pure
#                   planner (planner.test.js) and the schema/code drift guard
#                   (schemaCompat.test.js) run; the DESTRUCTIVE DB-gated proofs
#                   (test/constraints.dbtest.js, test/integration.dbtest.js)
#                   SKIP cleanly because the explicit opt-in marker
#                   ASDAIR_DB_TEST_ALLOW_DESTRUCTIVE is NOT set here (and
#                   ASDAIR_DB_URL is unset too). This is the zero-dependency
#                   gate on every push/PR touching the service, and it proves
#                   the destructive proofs stay inert without the opt-in.
#                   The SAME job also runs the outcome recorder's suite
#                   (services/asdair/outcome) -- the pure buildOutcome tests,
#                   the writers' fake-client transaction proofs and the write-
#                   side schema drift guard. That suite needs no dependencies
#                   at all (pg is lazily required), so it runs with no install
#                   step, and its own DB-gated proof skips here too.
#   * integration - the SAME two DB-gated files (plus the outcome recorder's
#                   own DB-gated proof, run as a SEPARATE step because it and
#                   integration.dbtest.js both re-create the literal `asdair`
#                   schema and must never run concurrently), EXPLICITLY opted in via
#                   ASDAIR_DB_TEST_ALLOW_DESTRUCTIVE=1 (the positive,
#                   single-purpose marker that authorises destructive DB
#                   testing) with ASDAIR_DB_URL pointed at a throwaway
#                   Postgres 16 service container. Each file applies the
#                   committed db/001_asdair_schema.sql from scratch itself, so
#                   the constraint proofs and the full
#                   schema->seed->data.js->planner.js path run against a real,
#                   clean Postgres. Synthetic data only; a disposable local
#                   service container, never a real project. Setting the marker
#                   ONLY in this throwaway job (never in unit) is what proves
#                   the opt-in gate works both ways.
#
# Secret scanning is intentionally NOT part of this workflow: the repo's
# existing secret scan already covers all tracked files (asdair included).
#
# Triggers only when the asdair service or this workflow change. Node 22 to
# match the repo's other service CI.

on:
  push:
    paths:
      - 'services/asdair/**'
      - '.github/workflows/asdair-tests.yml'
  pull_request:
    paths:
      - 'services/asdair/**'
      - '.github/workflows/asdair-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/asdair/skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (pg)
        run: npm ci

      - name: Run the skill suite with no DB (DB-gated proofs skip)
        run: node --test

      # The outcome recorder (the ONLY writers for asdair.orders /
      # order_events / rule_qa_log). Its unit suite is dependency-free: the
      # writers lazy-require pg and the transaction proofs use a fake client,
      # so nothing here connects to anything. test/outcome.dbtest.js skips,
      # for the same reason the skill's DB-gated proofs do.
      - name: Run the outcome recorder suite with no DB (DB-gated proof skips)
        working-directory: services/asdair/outcome
        run: node --test

      # BUILD-015 Stage 1 modules. All five are dependency-free at TEST time -
      # pg is lazily required by the writers and every test uses a fake client,
      # an injected HTTP client or an injected model, so nothing here connects
      # to a database, to Telegram or to a model gateway. Each is a separate
      # step so a failure names the module that broke rather than "asdair".
      #
      # These were NOT in CI when they were built, which is exactly how a green
      # pipeline starts lying: the suites existed and passed locally while CI
      # silently covered only skill/ and outcome/.
      - name: Run the ShopperBot intake receiver suite (offline)
        working-directory: services/asdair/intake
        run: node --test

      - name: Run the shop state store + status projection suite (offline)
        working-directory: services/asdair/shop
        run: node --test

      - name: Run the ShopperBot control surface suite (offline)
        working-directory: services/asdair/bot
        run: node --test

      - name: Run the vision transcription suite (offline, injected model)
        working-directory: services/asdair/transcribe
        run: node --test

      - name: Run the order reconciliation suite (offline, fake pg client)
        working-directory: services/asdair/reconcile
        run: node --test

      # THE CATALOGUE-GROUNDING INVARIANT. This suite is the guard against
      # silently regressing to open-ended transcription - the method that read
      # "Gourmet cat food" as "gourmet coffee" and invented a line that was not
      # on the page. It asserts the catalogue is loaded BEFORE any model call,
      # that the model is asked for candidate IDs rather than product names, and
      # that each known reading maps to its correct live regular id.
      - name: Run the catalogue-grounding invariant suite (offline)
        working-directory: services/asdair/interpret
        run: node --test

      - name: Run the cockpit read-API suite (offline, SELECT-only assertions)
        working-directory: services/asdair/cockpit-api
        run: node --test

      # THE KEYSTONE. Runs the REAL shopStore/shopperRoute/planner/resolveByCatalogue
      # against an in-memory pg carrying migration 006 and 008's ACTUAL unique
      # indexes and CHECKs, so a duplicate is refused by the same mechanism
      # Postgres uses rather than by a mock told to say no.
      - name: Run the pipeline orchestrator suite (offline)
        working-directory: services/asdair/pipeline
        run: node --test

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/asdair/skill
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI service container -- not a real project, no personal data.
      # Each DB-gated file applies db/001_asdair_schema.sql from scratch itself.
      ASDAIR_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      # PRIMARY OPT-IN: explicitly authorise the DESTRUCTIVE DB tests to run in
      # THIS throwaway job only. The unit job deliberately omits this marker, so
      # the same two files skip there -- proving the positive opt-in gate works.
      ASDAIR_DB_TEST_ALLOW_DESTRUCTIVE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (pg, for the live Postgres adapter)
        run: npm ci

      - name: Run the DB-gated constraint + integration proofs on a clean Postgres
        run: node --test test/constraints.dbtest.js test/integration.dbtest.js

      - name: Install dependencies for the outcome writers (pg)
        working-directory: services/asdair/outcome
        run: npm ci

      # SEPARATE step on purpose: this proof re-creates the literal `asdair`
      # schema, exactly as integration.dbtest.js does, so the two must run
      # sequentially rather than concurrently in one `node --test` invocation.
      # It applies the committed 001 + 004 migrations from scratch, records a
      # synthetic shop through recordShopOutcome.js, and proves the
      # rule_qa_log -> rules promotion back-link. Synthetic data only.
      # (The shared safety gate skill/test/dbSafeTarget.js resolves
      # pg-connection-string from the skill's node_modules, installed above.)
      - name: Run the DB-gated outcome + promotion proof on a clean Postgres
        working-directory: services/asdair/outcome
        run: node --test test/outcome.dbtest.js
