name: governor-tests

# CI for the retained session-governor spine (tools/governor/**).
#
# NARROWED 2026-08-02 by WO-OR-05, the operating-reset Phase 5 teardown. Eight modules and
# their suites were deleted (stop-controller, install-hooks, rotate-session, collect-state,
# worktree-recon, programme-state, plus the programme-state schema and fixtures). Ten
# modules survive; eight of them have suites. This job runs seven of those eight — see the
# exclusion note below for the one it does not, and why.
#
# WHY THIS EXISTS. Keel's WP-1 preflight reported that no workflow referenced
# tools/governor at all: the suite was builder-run only, so nothing enforced it on
# merge. The standing bar in this estate is that "proven" means EXECUTED IN CI, and a
# builder's own green is explicitly untrusted by default.
#
# WINDOWS-LATEST ON PURPOSE. The Governor runs on Warwick's Windows machine, and part
# of what it tests is a genuinely Windows-specific phenomenon: the atomic-write retry
# exists because a concurrent READER holding the target across a rename raises EPERM on
# Windows. Running this suite only on Linux would be testing a platform the product is
# never deployed to, and would report success over ground it never examined.
#
# THE GLOB FORM IS REQUIRED. `node --test tools/governor/` (directory form) fails with
# MODULE_NOT_FOUND on this codebase; the glob form is the one that works. That is a
# recorded finding, not a preference.
#
# THE EXECUTED-COUNT ASSERTION IS THE POINT. A suite that runs zero tests exits 0 and
# looks identical to a suite that passes. This job therefore fails when the reported
# pass count is not a positive integer, so "did not run" can never be mistaken for
# "healthy" — the same rule the Governor's own evaluator applies to BLIND vs GREEN.
#
# The path filter includes this file, so a change to the workflow itself always
# re-runs it. A path-filtered workflow that quietly stops running is indistinguishable
# from one that passes.

on:
  push:
    paths:
      - 'tools/governor/**'
      - '.github/workflows/governor-tests.yml'
  pull_request:
    paths:
      - 'tools/governor/**'
      - '.github/workflows/governor-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: State what this job does NOT cover
        shell: bash
        run: |
          echo "NOT COVERED BY CI — ONE suite is excluded:"
          echo "  reorient.test.mjs        — asserts against real git in the working checkout"
          echo ""
          echo "TWO EXCLUSIONS WERE REMOVED RATHER THAN LEFT IN PLACE:"
          echo "  collect-state.test.mjs   — the module and its suite were DELETED (WO-OR-05)."
          echo "  model-gate.test.mjs      — deleted when the model gate was retired, 2026-08-01."
          echo "A 'grep -v' naming a file that no longer exists is a filter nobody can tell is"
          echo "doing nothing, so each exclusion is removed when its subject is."
          echo ""
          echo "TWO OF THE TEN SURVIVING MODULES HAVE NO SUITE AT ALL, and neither a green here"
          echo "nor the count below says anything about them:"
          echo "  continuity.mjs           — the Honcho read/write path and the Stop hook"
          echo "  continuity-derive.mjs    — the SessionEnd derivation"
          echo "That is a real coverage gap, recorded as a finding rather than hidden."
          echo "A skipped test is NOT a passing test, and an untested module is not a tested one."

      - name: Run the portable governor suites and assert they actually executed
        shell: bash
        run: |
          set -o pipefail
          # ONE explicit exclusion, not a silent skip, and it is named above. Everything
          # else must be green.
          FILES=$(ls tools/governor/*.test.mjs | grep -v 'reorient.test.mjs')
          echo "running:"; echo "$FILES"

          # A DELETION MUST NOT BE ABLE TO LOOK LIKE A PASS. The executed-count assertion
          # below catches a suite that ran nothing, but not a narrowing that quietly
          # dropped whole FILES — seven green files and four green files both print a
          # positive pass count. So the file count is asserted too, against a literal held
          # here rather than derived from the glob that produced it.
          expected=7
          actual=$(echo "$FILES" | grep -c 'test.mjs')
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::SUITE SET CHANGED — expected ${expected} test files, found ${actual}. If a suite was legitimately added or deleted, update this literal in the same commit."
            exit 1
          fi
          node --test $FILES 2>&1 | tee suite.log
          status=$?

          # `node --test` reports totals in a TAP summary. Extract the pass count and
          # require it to be a positive integer. An empty or zero count means the
          # suite did not run, which is a FAILURE and never a pass.
          passed=$(grep -E '^# pass [0-9]+$' suite.log | tail -1 | awk '{print $3}')
          failed=$(grep -E '^# fail [0-9]+$' suite.log | tail -1 | awk '{print $3}')

          echo "executed-pass=${passed:-<absent>} executed-fail=${failed:-<absent>}"

          if [ -z "$passed" ]; then
            echo "::error::NOT RUN — no '# pass N' line found. A suite whose execution cannot be established is not a passing suite."
            exit 1
          fi
          if [ "$passed" -le 0 ]; then
            echo "::error::NOT RUN — zero subtests executed. Exit 0 over an empty suite is not evidence."
            exit 1
          fi
          if [ "${failed:-1}" -ne 0 ]; then
            echo "::error::FAILED — ${failed} failing test(s)."
            exit 1
          fi

          echo "OK — ${passed} tests executed and passed."
          exit $status
