name: cockpit-private-apps

# Proves the cockpit's local app-overlay mechanism: the path controls in private-apps.mjs, the
# single-canonicalisation route, and the add-only registry merge in public/apps.js.
# services/cockpit/private-apps-check.mjs is the executor and carries the reasoning.
#
# SCOPE, stated plainly: this gate checks that the extension point WORKS and that its controls hold.
# It makes no claim about names appearing anywhere in this repository, and it must not be cited as
# though it did. An earlier revision scanned for a name and reported clean, which was true within
# its own directory and worthless outside it.
#
# DELIBERATELY NO `paths:` FILTER. A path-filtered workflow that stops running disappears from
# `gh run list` entirely, and an absent run is indistinguishable from a green one at a glance —
# this estate has already been burned by exactly that.
#
# Pure Node, no browser, no database, no credentials. The two browser gates (render-check.mjs,
# nav-check.mjs) need Edge and stay local.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exits non-zero on a failure AND on a vacuous run (zero assertions executed). The Windows
      # case-folding rules are asserted here too — the platform is a parameter rather than a
      # `process.platform` branch, so this ubuntu runner proves the behaviour that actually ships
      # rather than only the one it happens to run under.
      - name: Private-app overlay mechanism and controls
        run: node services/cockpit/private-apps-check.mjs

      # ── The compensating render controls (WO-ZG) ────────────────────────────────────────────
      # render-check.mjs and nav-check.mjs need Edge and are BROKEN on the build machine
      # (D-2026-08-03-11), so these are the only render verification that exists. They are pure
      # Node, so unlike the browser gates they can run here.
      #
      # --self-test FIRST, deliberately: it mutation-tests each instrument and asserts a clean
      # control. A check that has silently stopped detecting looks exactly like a clean run, so
      # proving the gate can still FAIL is a precondition of trusting that it PASSED.
      - name: Template compiles and is structurally balanced (self-test first)
        run: |
          node services/cockpit/template-check.mjs --self-test
          node services/cockpit/template-check.mjs

      - name: Template survives real payload shapes (self-test first)
        run: |
          node services/cockpit/render-vm-check.mjs --self-test
          node services/cockpit/render-vm-check.mjs

      # Cache invalidation must stay DERIVED FROM CONTENT. If someone types a version literal back
      # into sw.js, the manual habit — and its silent failure, where the device keeps serving the
      # old bundle — comes back with it. This is the belt to that mechanism's braces.
      - name: Service-worker cache version is derived, not hand-typed
        run: node services/cockpit/sw-version-check.mjs

      # whyDown() shipped two UNREACHABLE branches and told Warwick a running service was
      # "down — 23". This executes the real function against a real DOMException.
      - name: A down service is explained in words, never a bare error number
        run: node services/cockpit/down-reason-check.mjs

      # /api/health reported the COMMIT and called it the running code, so a dirty working tree
      # was described by whatever git last recorded. provenance.mjs answers from the loaded bytes
      # instead, and sourceHash is structurally unable to repeat that failure because it never
      # consults git. This gate also re-derives SOURCE_MODULES from server.mjs's own imports and
      # fails on drift — so adding an import without declaring it goes red here rather than
      # silently shrinking what sourceHash covers. It cannot be run by starting the server:
      # server.mjs imports db.mjs, which opens two live pools at module load.
      - name: Build provenance is read from loaded bytes, never from git
        run: node services/cockpit/provenance-check.mjs
